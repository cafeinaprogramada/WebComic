<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="WebComic — leitura cinematográfica minimalista.">
<title>WebComic — Leitura</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
:root{color-scheme:light;--ink:#202020;--paper:#fff}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #333;outline-offset:4px}.intro{min-height:100svh;display:grid;place-items:center;text-align:center;padding:28px}.intro-inner{max-width:540px}.intro h1{font-size:clamp(3rem,11vw,6rem);letter-spacing:-.085em;font-weight:550;margin:0 0 1rem}.intro p{font-size:clamp(.92rem,2.5vw,1.05rem);color:#777;line-height:1.7;margin-bottom:2rem}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.choice{border:1px solid #d8d8d8;background:white;color:#222;padding:14px 24px;border-radius:999px;transition:background .2s,transform .2s}.choice:hover{background:#f4f4f4;transform:translateY(-2px)}.choice.primary{background:#222;color:#fff;border-color:#222}.choice.primary:hover{background:#444}.chapter{height:185svh;position:relative}.stage{height:100svh;position:sticky;top:0;display:grid;place-items:center;overflow:hidden;padding:clamp(12px,3vw,42px)}.panel{margin:0;width:min(95vw,1250px);height:min(85svh,900px);display:grid;place-items:center;opacity:0;transform:translate3d(0,80px,0);will-change:transform,opacity}.panel img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 15px 18px rgba(0,0,0,.07));will-change:transform}.ending{height:90svh;display:grid;place-items:center;text-align:center;padding:2rem}.ending h2{font-size:clamp(2rem,6vw,4rem);font-weight:450;letter-spacing:-.06em}.ending button{margin-top:1rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.chapter{height:165svh}.panel{width:97vw;height:82svh}}@media(prefers-reduced-motion:reduce){.panel,.panel img{will-change:auto}.choice{transition:none}}
</style>
</head>
<body>
<header class="intro" id="inicio"><div class="intro-inner"><h1>WebComic.</h1><p>Uma história em movimento.<br>Escolha como deseja ler.</p><div class="choices"><button class="choice primary" id="manual">Ler manualmente</button><button class="choice" id="automatic">Leitura automática</button></div></div></header>
<main id="story" aria-label="História em cinco quadros">
<section class="chapter" aria-label="Quadro 1"><div class="stage"><figure class="panel"><img src="1.png" alt="Quadro 1" fetchpriority="high" decoding="async"></figure></div></section>
<section class="chapter" aria-label="Quadro 2"><div class="stage"><figure class="panel"><img src="2.png" alt="Quadro 2" loading="lazy" decoding="async"></figure></div></section>
<section class="chapter" aria-label="Quadro 3"><div class="stage"><figure class="panel"><img src="3.png" alt="Quadro 3" loading="lazy" decoding="async"></figure></div></section>
<section class="chapter" aria-label="Quadro 4"><div class="stage"><figure class="panel"><img src="4.png" alt="Quadro 4" loading="lazy" decoding="async"></figure></div></section>
<section class="chapter" aria-label="Quadro 5"><div class="stage"><figure class="panel"><img src="5.png" alt="Quadro 5" loading="lazy" decoding="async"></figure></div></section>
</main>
<footer class="ending"><div><h2>Fim.</h2><button class="choice" id="restart">Recomeçar</button></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(()=>{
'use strict';
const chapters=[...document.querySelectorAll('.chapter')];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let auto=false,raf=0,last=0,pausedUntil=0,pausedPanel=-1;
const limit=()=>Math.max(0,document.documentElement.scrollHeight-innerHeight);
function stop(){auto=false;cancelAnimationFrame(raf)}
function scrollToStory(){window.scrollTo({top:chapters[0].offsetTop+2,behavior:reduce?'instant':'smooth'})}
function begin(mode){stop();scrollToStory();if(mode==='auto'){auto=true;last=performance.now();pausedPanel=-1;pausedUntil=performance.now()+1600;raf=requestAnimationFrame(step)}}
function step(now){
 if(!auto)return;
 const dt=Math.min(now-last,50);last=now;
 const y=scrollY;
 if(y>=limit()-3){stop();return}
 const idx=chapters.findIndex(c=>y>=c.offsetTop&&y<c.offsetTop+c.offsetHeight);
 if(idx>=0&&idx!==pausedPanel){
  const c=chapters[idx],middle=c.offsetTop+(c.offsetHeight-innerHeight)*.5;
  if(y>=middle-10){pausedPanel=idx;pausedUntil=now+3000}
 }
 if(now>=pausedUntil)window.scrollTo(0,Math.min(limit(),y+dt*.105));
 raf=requestAnimationFrame(step)
}
document.getElementById('manual').addEventListener('click',()=>begin('manual'));
document.getElementById('automatic').addEventListener('click',()=>begin('auto'));
document.getElementById('restart').addEventListener('click',()=>{stop();window.scrollTo({top:0,behavior:reduce?'instant':'smooth'})});
['wheel','touchstart','pointerdown','keydown'].forEach(type=>addEventListener(type,e=>{
 if(!auto)return;
 if(type==='keydown'&&!['ArrowUp','ArrowDown','PageUp','PageDown',' ','Home','End'].includes(e.key))return;
 stop()
},{passive:true}));
if(window.gsap&&window.ScrollTrigger&&!reduce){
 gsap.registerPlugin(ScrollTrigger);
 chapters.forEach(ch=>{
  const panel=ch.querySelector('.panel'),img=panel.querySelector('img');
  gsap.timeline({scrollTrigger:{trigger:ch,start:'top bottom',end:'bottom top',scrub:1.35,invalidateOnRefresh:true}})
   .fromTo(panel,{autoAlpha:0,y:()=>Math.min(innerHeight*.22,170),scale:.975},{autoAlpha:1,y:0,scale:1,duration:.38,ease:'sine.inOut'})
   .to(panel,{autoAlpha:1,y:()=>-Math.min(innerHeight*.045,34),scale:1,duration:.27,ease:'none'})
   .to(panel,{autoAlpha:0,y:()=>-Math.min(innerHeight*.22,170),scale:.985,duration:.35,ease:'sine.inOut'});
  gsap.fromTo(img,{yPercent:1.6,scale:1.018},{yPercent:-1.6,scale:1.005,ease:'none',scrollTrigger:{trigger:ch,start:'top bottom',end:'bottom top',scrub:1.7}});
 });
 gsap.from('.intro-inner',{autoAlpha:0,y:22,duration:1.15,ease:'power2.out'});
}else{
 chapters.forEach(ch=>{const p=ch.querySelector('.panel');p.style.opacity='1';p.style.transform='none'});
}
addEventListener('load',()=>window.ScrollTrigger?.refresh());
})();
</script>
</body></html>
