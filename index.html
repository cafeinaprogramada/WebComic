<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="WebComic — uma leitura cinematográfica.">
<title>WebComic — Leitura cinematográfica v0.7</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#fff;color:#222;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #333;outline-offset:4px}
.intro{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px}.intro h1{font-size:clamp(3.2rem,10vw,6rem);font-weight:500;letter-spacing:-.08em;margin:0 0 12px}.intro p{font-size:1rem;color:#777;line-height:1.7;margin:0 0 28px}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.choice{border:1px solid #d9d9d9;background:white;color:#222;border-radius:100px;padding:14px 24px;transition:background .2s}.choice:hover{background:#f5f5f5}.choice.primary{background:#222;border-color:#222;color:white}.choice.primary:hover{background:#444}
.chapter{height:235svh;position:relative}.stage{position:sticky;top:0;height:100svh;display:grid;place-items:center;overflow:hidden;padding:clamp(10px,3vw,38px)}
.panel-opacity{width:min(96vw,1250px);height:min(86svh,900px);display:grid;place-items:center;opacity:0;pointer-events:none;will-change:opacity}
.panel-scale{width:100%;height:100%;display:grid;place-items:center;transform:translate3d(0,0,0) scale(.89);will-change:transform}
.art-frame{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0;isolation:isolate}
.dialogue-overlay{position:absolute;inset:0;pointer-events:none;line-height:normal}
.dialogue-line{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-family:Arial,Helvetica,sans-serif;font-weight:750;letter-spacing:-.02em;line-height:1.2;text-transform:uppercase;color:#171717;opacity:0;transform:translate(-50%,-50%) scale(.68);transform-origin:center;pointer-events:none}
.dialogue-line.pop{animation:dialogue-pop .32s cubic-bezier(.18,1.65,.35,1) forwards}
@keyframes dialogue-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.68)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.panel-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:blur(3.5px);will-change:filter}
.ending{height:85svh;display:grid;place-items:center;text-align:center;padding:2rem}.ending h2{font-size:clamp(2rem,6vw,4rem);font-weight:450;letter-spacing:-.06em}.ending button{margin-top:12px}
@media(max-width:600px){.chapter{height:215svh}.panel-opacity{width:98vw;height:84svh}}
</style>
</head>
<body>
<header class="intro"><div><h1>WebComic.</h1><p>Uma história em movimento.<br>Escolha como deseja ler.</p><div class="choices"><button id="manual" class="choice primary">Ler manualmente</button><button id="automatic" class="choice">Leitura automática</button></div></div></header>
<main aria-label="História em cinco quadros">
<section class="chapter" aria-label="Quadro 1"><div class="stage"><div class="panel-opacity"><div class="panel-scale"><div class="art-frame"><img class="panel-image" src="1.png" alt="Quadro 1" fetchpriority="high" decoding="async"><div class="dialogue-overlay" aria-live="off"></div></div></div></div></div></section>
<section class="chapter" aria-label="Quadro 2"><div class="stage"><div class="panel-opacity"><div class="panel-scale"><div class="art-frame"><img class="panel-image" src="2.png" alt="Quadro 2" loading="lazy" decoding="async"><div class="dialogue-overlay" aria-live="off"></div></div></div></div></div></section>
<section class="chapter" aria-label="Quadro 3"><div class="stage"><div class="panel-opacity"><div class="panel-scale"><div class="art-frame"><img class="panel-image" src="3.png" alt="Quadro 3" loading="lazy" decoding="async"><div class="dialogue-overlay" aria-live="off"></div></div></div></div></div></section>
<section class="chapter" aria-label="Quadro 4"><div class="stage"><div class="panel-opacity"><div class="panel-scale"><div class="art-frame"><img class="panel-image" src="4.png" alt="Quadro 4" loading="lazy" decoding="async"><div class="dialogue-overlay" aria-live="off"></div></div></div></div></div></section>
<section class="chapter" aria-label="Quadro 5"><div class="stage"><div class="panel-opacity"><div class="panel-scale"><div class="art-frame"><img class="panel-image" src="5.png" alt="Quadro 5" loading="lazy" decoding="async"><div class="dialogue-overlay" aria-live="off"></div></div></div></div></div></section>
</main>
<footer class="ending"><div><h2>Fim.</h2><button class="choice" id="restart">Recomeçar</button></div></footer>
<script>
(()=>{
'use strict';
// The original v0.6 panel animation is retained: opacity, scale and blur are independent.
const chapters=[...document.querySelectorAll('.chapter')];
const nodes=chapters.map(c=>({alpha:c.querySelector('.panel-opacity'),scale:c.querySelector('.panel-scale'),img:c.querySelector('.panel-image'),overlay:c.querySelector('.dialogue-overlay')}));
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
const smooth=t=>t*t*(3-2*t);
const lerp=(a,b,t)=>a+(b-a)*t;
let auto=false,frame=0,last=0,holdPanel=-1,holdUntil=0,scrollScheduled=false,mode='manual';
let config=null;
const sessions=chapters.map(()=>({started:false,timers:[],duration:0}));
function state(p){
 p=clamp(p);let strength,opacity;
 if(p<.12){strength=0;opacity=lerp(0,.53,smooth(p/.12))}
 else if(p<.28){strength=smooth((p-.12)/.16);opacity=lerp(.53,1,strength)}
 else if(p<=.72){strength=1;opacity=1}
 else if(p<.88){strength=smooth((.88-p)/.16);opacity=lerp(.53,1,strength)}
 else{strength=0;opacity=lerp(0,.53,smooth((1-p)/.12))}
 return {opacity,scale:lerp(.89,1,strength),blur:lerp(3.5,0,strength),y:lerp(p<.5?26:-26,0,strength)};
}
function progress(ch){return clamp((scrollY-(ch.offsetTop-innerHeight))/(ch.offsetHeight+innerHeight))}
function render(i,p){
 const n=nodes[i],v=state(p);
 n.alpha.style.opacity=v.opacity.toFixed(4);
 n.scale.style.transform='translate3d(0,'+v.y.toFixed(2)+'px,0) scale('+v.scale.toFixed(4)+')';
 n.img.style.filter='blur('+v.blur.toFixed(3)+'px)';
}
function validPanel(i){return config?.panels?.[i]||{dialogues:[],holdAfterDialogue:3}}
function stopDialogue(i){
 const s=sessions[i];s.timers.forEach(clearTimeout);s.timers=[];s.started=false;
 nodes[i].overlay.querySelectorAll('.dialogue-line').forEach(el=>{el.classList.remove('pop');el.style.opacity='0';el.textContent=''});
}
function schedule(i,fn,ms){sessions[i].timers.push(setTimeout(fn,Math.max(0,ms)))}
function fitDialogue(i){
 const n=nodes[i],img=n.img;
 const natural=img.naturalWidth||1000,shown=img.getBoundingClientRect().width||natural;
 n.overlay.querySelectorAll('.dialogue-line').forEach(el=>{
  const font=Number(el.dataset.fontSize)||38;
  el.style.fontSize=Math.max(5,font*shown/natural)+'px';
 });
}
function prepareDialogues(){
 chapters.forEach((_,i)=>{
  stopDialogue(i);
  const overlay=nodes[i].overlay;overlay.replaceChildren();
  const panel=validPanel(i);
  (panel.dialogues||[]).forEach(d=>{
   const el=document.createElement('div');
   el.className='dialogue-line';el.dataset.fontSize=d.fontSize||38;
   el.style.left=clamp(Number(d.x)||0,0,100)+'%';
   el.style.top=clamp(Number(d.y)||0,0,100)+'%';
   el.style.width=clamp(Number(d.width)||30,5,100)+'%';
   el.setAttribute('aria-label',String(d.text||''));
   overlay.append(el);
  });
  fitDialogue(i);
 })
}
function startDialogue(i){
 const s=sessions[i],panel=validPanel(i);
 if(s.started)return s.duration;
 s.started=true;
 const lines=[...nodes[i].overlay.querySelectorAll('.dialogue-line')];
 let elapsed=0;
 (panel.dialogues||[]).forEach((d,j)=>{
  const el=lines[j],chars=Array.from(String(d.text||'')),interval=1000/clamp(Number(d.charactersPerSecond)||35,1,120);
  elapsed+=Math.max(0,Number(d.delay)||0)*1000;
  const start=elapsed;
  schedule(i,()=>{if(!el)return;el.textContent='';el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')},start);
  chars.forEach((char,k)=>schedule(i,()=>{if(el)el.textContent+=char},start+320+(k+1)*interval));
  elapsed=start+320+chars.length*interval;
 });
 s.duration=elapsed;
 return elapsed;
}
function renderAll(){
 chapters.forEach((ch,i)=>{
  const p=progress(ch);render(i,p);
  // Manual reading reveals text at full focus. Auto reading waits until the central stop.
  if(mode==='manual'&&p>=.34&&p<=.78&&!sessions[i].started)startDialogue(i);
  if((p<.10||p>.90)&&sessions[i].started)stopDialogue(i);
 })
}
function onScroll(){if(scrollScheduled)return;scrollScheduled=true;requestAnimationFrame(()=>{scrollScheduled=false;renderAll()})}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{fitAll();renderAll()},{passive:true});
function fitAll(){nodes.forEach((_,i)=>fitDialogue(i))}
addEventListener('load',()=>{fitAll();renderAll()});
nodes.forEach((n,i)=>n.img.addEventListener('load',()=>fitDialogue(i)));
function stopAuto(){auto=false;cancelAnimationFrame(frame)}
const maxScroll=()=>Math.max(0,document.documentElement.scrollHeight-innerHeight);
function step(now){
 if(!auto)return;
 const dt=Math.min(50,Math.max(0,now-last));last=now;
 const y=scrollY;
 if(y>=maxScroll()-3){stopAuto();return}
 const idx=chapters.findIndex(ch=>y>=ch.offsetTop&&y<ch.offsetTop+ch.offsetHeight);
 if(idx>=0&&idx!==holdPanel){
  const ch=chapters[idx],center=ch.offsetTop+(ch.offsetHeight-innerHeight)*.5;
  if(y>=center){
   holdPanel=idx;
   const duration=startDialogue(idx);
   holdUntil=now+duration+Math.max(0,Number(validPanel(idx).holdAfterDialogue)||0)*1000;
  }
 }
 if(now>=holdUntil){scrollTo(0,Math.min(maxScroll(),y+dt*.085));onScroll()}
 frame=requestAnimationFrame(step)
}
function begin(nextMode){
 stopAuto();mode=nextMode;holdPanel=-1;holdUntil=0;
 chapters.forEach((_,i)=>stopDialogue(i));
 scrollTo({top:chapters[0].offsetTop,behavior:'instant'});renderAll();
 if(mode==='auto'){auto=true;last=performance.now();holdUntil=last+700;frame=requestAnimationFrame(step)}
}
document.getElementById('manual').addEventListener('click',()=>begin('manual'));
document.getElementById('automatic').addEventListener('click',()=>begin('auto'));
document.getElementById('restart').addEventListener('click',()=>{stopAuto();mode='manual';chapters.forEach((_,i)=>stopDialogue(i));scrollTo({top:0,behavior:'smooth'})});
['wheel','touchstart','pointerdown','keydown'].forEach(type=>addEventListener(type,e=>{
 if(!auto)return;
 if(type==='keydown'&&!['ArrowUp','ArrowDown','PageUp','PageDown',' ','Home','End'].includes(e.key))return;
 stopAuto();mode='manual'
},{passive:true}));
async function loadConfig(){
 try{
  const response=await fetch('./dialogos.json',{cache:'no-store'});
  if(!response.ok)throw Error('Configuração não encontrada');
  const data=await response.json();
  if(!Array.isArray(data.panels))throw Error('Configuração inválida');
  config=data;prepareDialogues();renderAll();
 }catch(error){console.warn('Leitor sem configuração de diálogos:',error)}
}
renderAll();loadConfig();
})();
</script>
</body></html>
